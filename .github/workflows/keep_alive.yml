name: Streamlit Keep Alive

on:
  schedule:
    - cron: '0 */6 * * *'  # รันทุก 6 ชั่วโมง
  workflow_dispatch:

jobs:
  wake-up:
    runs-on: ubuntu-24.04  # ระบุเวอร์ชัน OS ให้ชัดเจน
    steps:
      - name: Checkout code
        uses: actions/checkout@v4  # หากมีเวอร์ชันใหม่กว่านี้ ให้อัปเดตเป็นเลขล่าสุด

      - name: Set up Python
        uses: actions/setup-python@v5  # หากมีเวอร์ชันใหม่กว่านี้ ให้อัปเดตเป็นเลขล่าสุด
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run wake-up script
        run: python main.py
